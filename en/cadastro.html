<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Angatu</title>
    <link rel="stylesheet" href="../assets/css/tema.css">
    <link rel="stylesheet" href="../assets/css/acesso.css">
</head>
<body>

    <main class="acesso">
        <a class="acesso-marca" href="index.html" title="Back to home">
            <img src="../assets/img/logo.png" alt="" width="44" height="44"> Angatu
        </a>

        <!-- Sem back-end: os campos não têm "name", então nada é enviado; o formulário só valida e avança. -->
        <form class="acesso-cartao" action="login.html">
            <h1>Create account</h1>
            <p class="acesso-sub">Fill in your details to continue.</p>
            <div class="campos campos-duplos">
                <div class="campo">
                    <label for="nome">Name</label>
                    <input id="nome" type="text" required>
                </div>
                <div class="campo">
                    <label for="sobrenome">Last name</label>
                    <input id="sobrenome" type="text" required>
                </div>
                <div class="campo">
                    <label for="telefone">Phone number</label>
                    <input id="telefone" type="tel" required>
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" required>
                </div>
                <div class="campo">
                    <label for="senha">Password</label>
                    <input id="senha" type="password" required>
                </div>
                <div class="campo">
                    <label for="confirmacao">Confirm your password</label>
                    <input id="confirmacao" type="password" required>
                </div>
            </div>
            <button type="submit">Sign up</button>
            <p class="acesso-alt">Already have an account? <a href="login.html">Log in</a></p>
        </form>
    </main>
</body>
</html>
