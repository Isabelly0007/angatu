<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Angatu</title>
    <link rel="stylesheet" href="../assets/css/tema.css">
    <link rel="stylesheet" href="../assets/css/acesso.css">
</head>
<body>

    <main class="acesso">
        <a class="acesso-marca" href="index.html" title="Voltar ao início">
            <img src="../assets/img/logo.png" alt="" width="44" height="44"> Angatu
        </a>

        <!-- Sem back-end: os campos não têm "name", então nada é enviado; o formulário só valida e avança. -->
        <form class="acesso-cartao" action="introducao.html">
            <h1>Entrar</h1>
            <p class="acesso-sub">Acesse para explorar os capítulos.</p>
            <div class="campos">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input id="senha" type="password" required>
                </div>
            </div>
            <button type="submit">Entrar</button>
            <p class="acesso-alt">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </form>
    </main>
</body>
</html>
